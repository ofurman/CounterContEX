[project]
name = "countercontex"
version = "0.1.0"
description = "Focused TabICL counterfactual generator, benchmark, and baseline suite."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = ["tabicl-counterfactual-suite"]

[dependency-groups]
dev = ["ruff==0.15.12"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.sources]
tabicl-counterfactual-suite = { workspace = true }

[tool.uv.workspace]
members = ["experiments/zeroshot_cf"]

[tool.pytest.ini_options]
testpaths = ["experiments/zeroshot_cf/tests"]
minversion = "8.0"
xfail_strict = true
addopts = "--durations=10"

[tool.ruff]
target-version = "py312"
line-length = 88
output-format = "full"
src = ["experiments/zeroshot_cf"]
extend-exclude = [
  "data",
  "docs",
  "experiments/zeroshot_cf/models",
  "experiments/zeroshot_cf/results",
  "experiments/zeroshot_cf/vendor",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"experiments/zeroshot_cf/discriminator.py" = ["UP037"]
