schema_version: countercontex.matrix.v1
suite: campaign_e12_pushforward_pilot
output_root: experiments/zeroshot_cf/results/diagnostics/e12_pushforward_pilot
datasets: [heloc, bank_marketing, give_me_some_credit, lending_club]
methods:
  - name: countercontex
    variant: tabicl_distribution
    params:
      search: {cf_mode: sparse, tau: 0.5, strict_proposal_budget: true, numerical_decoder: iid, numerical_proposal_budget: 9, categorical_decoder: iid, categorical_proposal_budget: 9}
      foundation: {backend: tabicl, n_estimators: 1, temperature: 1.0, context_size: 512, context_labels: predictions}
target_models:
  - {name: retained_logistic_regression, params: {C: 1.0, max_iter: 1000, seed: 42}}
  - {name: retained_mlp, params: {hidden_layer_sizes: [64, 32], max_iter: 300, seed: 42}}
  - {name: retained_xgboost, params: {n_estimators: 200, max_depth: 4, learning_rate: 0.05, seed: 42}}
seeds: [17, 42, 101]
protocol:
  max_test: 20
  test_selection: target_stratified
  factual_partition: validation
  proposal_pushforward: {diagnostic_version: proposal-diagnostic-v1, numerical_integration_points: 256, categorical_policy: exact-support, mc_bank_count: 5, mc_bank_size: 64, best_of_b_budgets: [9, 49]}
evaluation: {probability_threshold: 0.7}
cache_paths: {tabicl: experiments/zeroshot_cf/models/tabicl}
device: cuda
legacy_export: false
