  - {name: countercontex, params: {search: {tau: 0.6, cf_mode: sparse, candidate_quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]}, foundation: {backend: tabicl, n_estimators: 1, confidence_quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]}}}
