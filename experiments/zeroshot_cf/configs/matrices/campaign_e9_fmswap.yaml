  # Stage 11 implements and versions this backend before execution.
  - {name: countercontex, params: {search: {cf_mode: sparse, candidate_quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]}, foundation: {backend: tabpfn, n_estimators: 1}}}
